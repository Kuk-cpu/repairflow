services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: repairflow
      POSTGRES_DB: repairflow_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairflow -d repairflow_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - repairflow-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    profiles: ["application"]
    build: .
    environment: &app-environment
      DATABASE_URL: postgresql://repairflow:repairflow@postgres:5432/repairflow_dev?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-demo-secret-change-before-deploying}
      BETTER_AUTH_URL: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
      DEMO_MODE: "true"
      UPLOAD_DIR: /app/.data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: RepairFlow <repairflow@example.test>
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - repairflow-uploads:/app/.data/uploads

  worker:
    profiles: ["application"]
    build: .
    command: pnpm worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - repairflow-uploads:/app/.data/uploads

volumes:
  repairflow-postgres:
  repairflow-uploads:
