name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repairflow
          POSTGRES_PASSWORD: repairflow
          POSTGRES_DB: repairflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repairflow -d repairflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://repairflow:repairflow@localhost:5432/repairflow_test?schema=public
      DEMO_MODE: "true"
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
      AI_PROVIDER: demo
      SMTP_ENABLED: "false"
      UPLOAD_DIR: /tmp/repairflow-ci/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
